    // Helper to calculate standard RSI
    function calculateTrackerRSI(candles, period = 14) {
      if (candles.length <= period) return 50; // default neutral
      
      let gains = 0;
      let losses = 0;
      
      // First RSI value calculation
      for (let i = 1; i <= period; i++) {
        const diff = candles[i] - candles[i - 1];
        if (diff > 0) gains += diff;
        else losses -= diff;
      }
      
      let avgGain = gains / period;
      let avgLoss = losses / period;
      
      // Smoothed RSI calculation for remaining values
      for (let i = period + 1; i < candles.length; i++) {
        const diff = candles[i] - candles[i - 1];
        avgGain = (avgGain * (period - 1) + (diff > 0 ? diff : 0)) / period;
        avgLoss = (avgLoss * (period - 1) + (diff < 0 ? -diff : 0)) / period;
      }
      
      if (avgLoss === 0) return 100;
      const rs = avgGain / avgLoss;
      return 100 - (100 / (1 + rs));
    }

    // ========== MULTI-COIN REAL-TIME TRACKER (1s) ==========
    const MultiTracker = {
      trackers: {}, // Schema: { COIN: { running: bool, mode: 'auto'|'dip', offsetSteps: int, autoSteps: int, usdAmount: float, priceInterval: id, candleInterval: id, bid: float, ask: float, realPrice: float, priceHistory: array, rsi: float, vol: float, slope1m: float, slope5m: float, status: string, suggestedPrice: float, tickSize: float, priceD: int, maxSteps: int } }
      defaultUsdAmount: 100,
      selectedCoin: null,

      init() {
        const defaultUsdInput = document.getElementById('defaultTrackerUsdAmount');
        if (defaultUsdInput) {
          this.defaultUsdAmount = parseFloat(defaultUsdInput.value) || 100;
        }

        // Restore tracked coins
        try {
          const saved = localStorage.getItem('mt_tracked_coins');
          if (saved) {
            const coins = JSON.parse(saved);
            if (Array.isArray(coins)) {
              setTimeout(() => {
                coins.forEach(coin => {
                  this.add(coin, true);
                });

                // Restore selected MultiTracker coin highlight
                const savedSel = localStorage.getItem('selectedMultiTrackerCoin');
                if (savedSel && this.trackers[savedSel]) {
                  this.selectCard(savedSel);
                } else {
                  const mobileTradeCoin = localStorage.getItem('mobileTradeCoin');
                  if (mobileTradeCoin && this.trackers[mobileTradeCoin]) {
                    this.selectCard(mobileTradeCoin);
                  }
                }
              }, 500);
            }
          }
        } catch (e) {
          console.warn('Failed to restore MultiTracker coins:', e);
        }
      },

      selectCard(coin) {
        this.selectedCoin = coin;
        if (coin) {
          localStorage.setItem('selectedMultiTrackerCoin', coin);
        } else {
          localStorage.removeItem('selectedMultiTrackerCoin');
        }
        const cards = document.querySelectorAll('.multi-tracker-card');
        cards.forEach(card => {
          const cardCoin = card.id.replace('mt-card-', '');
          if (cardCoin === coin) {
            card.classList.add('selected-card');
          } else {
            card.classList.remove('selected-card');
          }
        });
      },

      add(coin, quiet = false) {
        if (!coin) return;
        coin = coin.toUpperCase().trim();
        if (this.trackers[coin]) {
          if (!quiet) toast(`${coin} tracker already exists!`, 'error');
          this.start(coin); // Start it if stopped
          this.scrollToPanel();
          return;
        }

        // Initialize state for this coin with the current mobile buy USD amount
        let currentUsdVal = this.defaultUsdAmount;
        const amtUsdField = document.getElementById('amtUsd');
        if (amtUsdField) {
          currentUsdVal = parseFloat(amtUsdField.textContent.replace(/[$,]/g, '')) || this.defaultUsdAmount;
        }

        this.trackers[coin] = {
          running: false,
          offsetSteps: 1, // default steps offset is 1 (corresponds to -1 step below bid)
          usdAmount: currentUsdVal,
          priceInterval: null,
          candleInterval: null,
          bid: 0,
          ask: 0,
          realPrice: 0,
          priceHistory: [],
          rsi: 50,
          vol: 0,
          slope1m: 0,
          slope5m: 0,
          status: 'Initializing...',
          suggestedPrice: 0,
          tickSize: 0.01,
          priceD: 2,
          maxSteps: 500
        };

        // Asynchronously load Coinbase product details
        this.loadProductDetails(coin);

        // Render card
        this.selectedCoin = coin;
        if (coin) {
          localStorage.setItem('selectedMultiTrackerCoin', coin);
        }
        this.renderContainer();
        this.start(coin);
        this.scrollToPanel();

        // Save trackers list
        localStorage.setItem('mt_tracked_coins', JSON.stringify(Object.keys(this.trackers)));

        if (!quiet) toast(`Started tracker for ${coin}`);
      },

      async loadProductDetails(coin) {
        try {
          const res = await fetch(`https://api.exchange.coinbase.com/products/${coin}-USD`);
          if (res.ok) {
            const d = await res.json();
            const t = this.trackers[coin];
            if (t) {
              t.tickSize = parseFloat(d.quote_increment || '0.01');
              t.priceD = (d.quote_increment || '0.01').toString().replace(/^[^.]*\.?/, '').length;
              this.updateSliderRange(coin);
              this.calculatePrice(coin);
            }
          }
        } catch (err) {
          console.warn(`[MultiTracker] Failed to load product info for ${coin}:`, err.message);
        }
      },

      updateSliderRange(coin) {
        const t = this.trackers[coin];
        if (!t || !t.bid || !t.tickSize) return;
        const maxStepsFor2Pct = Math.round((t.bid * 0.02) / t.tickSize);
        t.maxSteps = Math.max(100, Math.min(10000, maxStepsFor2Pct));
        
        const card = document.getElementById(`mt-card-${coin}`);
        if (card) {
          const slider = card.querySelector('.mt-offset-range');
          if (slider) {
            slider.max = t.maxSteps + 1;
            slider.value = (t.maxSteps + 1) - t.offsetSteps;
          }
        }
      },

      scrollToPanel() {
        const tradeTab = document.querySelector('.tab[data-tab="trade"]');
        if (tradeTab) tradeTab.click();

        const panel = document.getElementById('activeTrackersPanel');
        if (panel) {
          panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      },

      remove(coin) {
        this.stop(coin);
        delete this.trackers[coin];
        const remaining = Object.keys(this.trackers);
        if (this.selectedCoin === coin) {
          this.selectCard(remaining.length > 0 ? remaining[0] : null);
        }
        localStorage.setItem('mt_tracked_coins', JSON.stringify(Object.keys(this.trackers)));
        this.renderContainer();
        toast(`Removed tracker for ${coin}`);
      },

      toggle(coin) {
        if (!this.trackers[coin]) return;
        if (this.trackers[coin].running) {
          this.stop(coin);
        } else {
          this.start(coin);
        }
      },

      start(coin) {
        const t = this.trackers[coin];
        if (!t || t.running) return;

        t.running = true;
        
        // Initial execution
        this.tickPrice(coin);
        this.tickCandles(coin);

        // Price check loop every 1 second
        t.priceInterval = setInterval(() => this.tickPrice(coin), 1000);

        // Candle indicator calculation loop every 5 seconds
        t.candleInterval = setInterval(() => this.tickCandles(coin), 5000);

        this.updateCardUI(coin);
      },

      stop(coin) {
        const t = this.trackers[coin];
        if (!t || !t.running) return;

        t.running = false;
        if (t.priceInterval) {
          clearInterval(t.priceInterval);
          t.priceInterval = null;
        }
        if (t.candleInterval) {
          clearInterval(t.candleInterval);
          t.candleInterval = null;
        }

        this.updateCardUI(coin);
      },



      updateOffsetSteps(coin, value) {
        const t = this.trackers[coin];
        if (!t) return;
        const max = t.maxSteps || 500;
        const sliderVal = parseInt(value) || 1;
        t.offsetSteps = Math.max(0, Math.min(max, (max + 1) - sliderVal));
        
        const card = document.getElementById(`mt-card-${coin}`);
        if (card) {
          const valEl = card.querySelector('.mt-offset-val');
          const diffPct = (t.offsetSteps * t.tickSize / t.bid) * 100;
          if (valEl) {
            if (t.offsetSteps === 0) {
              valEl.textContent = `0 steps (0.00%)`;
            } else {
              valEl.textContent = `-${t.offsetSteps} steps (-${diffPct.toFixed(2)}%)`;
            }
          }
        }
        
        this.calculatePrice(coin);
      },

      adjustSteps(coin, delta) {
        const t = this.trackers[coin];
        if (!t) return;
        let newSteps = t.offsetSteps + delta;
        const max = t.maxSteps || 500;
        if (newSteps < 0) newSteps = 0;
        if (newSteps > max) newSteps = max;
        t.offsetSteps = newSteps;
        this.calculatePrice(coin);
      },

       updateUsdAmount(coin, value) {
        if (!this.trackers[coin]) return;
        const val = parseFloat(value) || 0;
        this.trackers[coin].usdAmount = val;

        // Sync back to main buy panel
        if (usdBalance > 0) {
          const pct = Math.min(100, Math.round(val / usdBalance * 100));
          document.getElementById('amtInput').value = pct;
          document.getElementById('amtUsd').textContent = '$' + val.toFixed(2);
          localStorage.setItem('buySize', pct);

          // Sync to all other tracker cards
          for (const c in this.trackers) {
            if (c !== coin) {
              this.trackers[c].usdAmount = val;
              const card = document.getElementById(`mt-card-${c}`);
              if (card) {
                const input = card.querySelector('.mt-card-usd-input');
                if (input) input.value = val;
              }
            }
          }
        }
      },

      async tickPrice(coin) {
        const t = this.trackers[coin];
        if (!t || !t.running) return;

        try {
          const res = await fetch(`https://api.exchange.coinbase.com/products/${coin}-USD/ticker`);
          if (!res.ok) throw new Error('Ticker fetch failed');
          const data = await res.json();
          
          t.bid = parseFloat(data.bid);
          t.ask = parseFloat(data.ask);
          t.realPrice = parseFloat(data.price || data.bid);
          if (data.volume) {
            t.volume24h = parseFloat(data.volume) * t.realPrice;
          }

          const now = Date.now();
          if (t.realPrice) {
            if (!t.priceHistory) t.priceHistory = [];
            t.priceHistory.push({ time: now, price: t.realPrice });
            t.priceHistory = t.priceHistory.filter(h => now - h.time <= 70000);
          }

          if (!t.maxSteps || t.maxSteps === 500) {
            this.updateSliderRange(coin);
          }
          
          this.calculatePrice(coin);
          this.updateCardPricesUI(coin);
          this.updateCardStatusUI(coin);

          const price30s = this.getHistoricPrice(t.priceHistory, 30);
          const price1m = this.getHistoricPrice(t.priceHistory, 60);
          this.updateCardRealChangesUI(coin, price30s, price1m);
        } catch (err) {
          console.warn(`[MultiTracker] Price tick error for ${coin}:`, err.message);
        }
      },

      getHistoricPrice(history, secondsAgo) {
        if (!history || history.length === 0) return null;
        const targetTime = Date.now() - secondsAgo * 1000;
        let closest = null;
        let minDiff = Infinity;
        for (const h of history) {
          const diff = Math.abs(h.time - targetTime);
          if (diff < minDiff) {
            minDiff = diff;
            closest = h;
          }
        }
        if (closest && minDiff < 3000) {
          return closest.price;
        }
        return null;
      },

      formatVol(v) {
        if (!v || isNaN(v)) return '—';
        if (v >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
        if (v >= 1e6) return '$' + (v / 1e6).toFixed(2) + 'M';
        if (v >= 1e3) return '$' + (v / 1e3).toFixed(1) + 'K';
        return '$' + v.toFixed(2);
      },

      updateCardRealChangesUI(coin, price30s, price1m) {
        const t = this.trackers[coin];
        if (!t || !t.realPrice) return;
        
        const el30s = document.getElementById(`mt-chg30s-${coin}`);
        const card30s = document.getElementById(`mt-card-chg30s-${coin}`);
        if (el30s) {
          if (price30s) {
            const pct = ((t.realPrice - price30s) / price30s) * 100;
            const sign = pct > 0 ? '+' : '';
            el30s.textContent = sign + pct.toFixed(2) + '%';
            const stateClass = pct > 0.01 ? 'rising' : (pct < -0.01 ? 'falling' : 'neutral');
            el30s.className = 'mt-card-val mt-val-large ' + stateClass;
            if (card30s) card30s.className = 'mt-card mt-highlight-card ' + stateClass;
          } else {
            el30s.textContent = '—';
            el30s.className = 'mt-card-val mt-val-large neutral';
            if (card30s) card30s.className = 'mt-card mt-highlight-card neutral';
          }
        }
        
        const el1m = document.getElementById(`mt-chg1m-${coin}`);
        const card1m = document.getElementById(`mt-card-chg1m-${coin}`);
        if (el1m) {
          if (price1m) {
            const pct = ((t.realPrice - price1m) / price1m) * 100;
            const sign = pct > 0 ? '+' : '';
            el1m.textContent = sign + pct.toFixed(2) + '%';
            const stateClass = pct > 0.01 ? 'rising' : (pct < -0.01 ? 'falling' : 'neutral');
            el1m.className = 'mt-card-val mt-val-large ' + stateClass;
            if (card1m) card1m.className = 'mt-card mt-highlight-card ' + stateClass;
          } else {
            el1m.textContent = '—';
            el1m.className = 'mt-card-val mt-val-large neutral';
            if (card1m) card1m.className = 'mt-card mt-highlight-card neutral';
          }
        }
      },

      async tickCandles(coin) {
        const t = this.trackers[coin];
        if (!t || !t.running) return;

        try {
          const [res1m, res5m] = await Promise.all([
            fetch(`https://api.exchange.coinbase.com/products/${coin}-USD/candles?granularity=60`),
            fetch(`https://api.exchange.coinbase.com/products/${coin}-USD/candles?granularity=300`)
          ]);

          if (!res1m.ok || !res5m.ok) throw new Error('Candles request failed');

          const data1m = await res1m.json();
          const data5m = await res5m.json();

          if (!data1m || data1m.length < 5 || !data5m || data5m.length < 15) {
            t.status = 'Insufficient history';
            this.updateCardStatusUI(coin);
            return;
          }

          // If realPrice/bid/ask are not initialized yet, populate them from the current candle
          if (!t.realPrice && data1m && data1m[0]) {
            t.realPrice = parseFloat(data1m[0][4]);
            if (!t.bid) t.bid = t.realPrice;
            if (!t.ask) t.ask = t.realPrice;
          }

          // Pre-populate price history if it has fewer than 10 entries (e.g. on startup) to show 30s/1m change immediately
          if (t.realPrice && (!t.priceHistory || t.priceHistory.length < 10)) {
            const now = Date.now();
            const history = [];
            const currentPrice = t.realPrice;
            const price60sAgo = data1m && data1m[1] ? parseFloat(data1m[1][4]) : currentPrice;
            const price30sAgo = (currentPrice + price60sAgo) / 2;

            for (let i = 70; i >= 0; i--) {
              const time = now - i * 1000;
              let price;
              if (i <= 30) {
                const pct = i / 30;
                price = currentPrice * (1 - pct) + price30sAgo * pct;
              } else {
                const pct = (i - 30) / 40;
                price = price30sAgo * (1 - pct) + price60sAgo * pct;
              }
              history.push({ time, price });
            }
            t.priceHistory = history;

            // Immediately update the change values in UI
            const price30s = this.getHistoricPrice(t.priceHistory, 30);
            const price1m = this.getHistoricPrice(t.priceHistory, 60);
            this.updateCardRealChangesUI(coin, price30s, price1m);
          }

          // newest first, so index 0 is current candle
          const closes1m = data1m.slice(0, 6).reverse().map(c => parseFloat(c[4]));
          const closes5m = data5m.slice(0, 16).reverse().map(c => parseFloat(c[4]));

          // 1. Calculate 1m slope
          const closeCurrent1m = closes1m[closes1m.length - 1];
          const closePrev1m = closes1m[closes1m.length - 5];
          t.slope1m = ((closeCurrent1m - closePrev1m) / closePrev1m) * 100;

          // 2. Calculate 5m slope
          const closeCurrent5m = closes5m[closes5m.length - 1];
          const closePrev5m = closes5m[closes5m.length - 5];
          t.slope5m = ((closeCurrent5m - closePrev5m) / closePrev5m) * 100;

          // 3. Calculate 5m RSI (14 period)
          t.rsi = calculateTrackerRSI(closes5m, 14);

          // 4. Volatility
          const highs1m = data1m.slice(0, 10).map(c => parseFloat(c[2]));
          const lows1m = data1m.slice(0, 10).map(c => parseFloat(c[1]));
          t.vol = ((Math.max(...highs1m) - Math.min(...lows1m)) / Math.min(...lows1m)) * 100;



          // Status text
          if (t.slope1m > 0.05 && t.slope5m > 0.05) {
            t.status = 'Strong Growth 🚀';
          } else if (t.slope1m > 0.05) {
            t.status = '1m Growth / Pullback 📈';
          } else if (t.slope1m < -0.05 && t.slope5m < -0.05) {
            t.status = 'Heavy Drop 📉';
          } else if (t.slope1m < -0.05) {
            t.status = '1m Drop / Retracement 📉';
          } else {
            t.status = 'Sideways trend';
          }

          this.calculatePrice(coin);
          this.updateCardMetricsUI(coin);
          this.updateCardStatusUI(coin);
        } catch (err) {
          console.warn(`[MultiTracker] Candles tick error for ${coin}:`, err.message);
        }
      },

      calculatePrice(coin) {
        const t = this.trackers[coin];
        if (!t || !t.bid || !t.ask) return;

        const activeSteps = t.offsetSteps;
        const priceDiff = activeSteps * t.tickSize;
        const suggested = t.bid - priceDiff;
        const diffPct = -(priceDiff / t.bid) * 100;

        t.suggestedPrice = parseFloat(suggested.toFixed(t.priceD));

        const card = document.getElementById(`mt-card-${coin}`);
        if (card) {
          const recPriceEl = card.querySelector('.mt-rec-price');
          if (recPriceEl) recPriceEl.textContent = '$' + t.suggestedPrice.toFixed(t.priceD);

          const diffEl = card.querySelector('.mt-rec-diff');
          if (diffEl) {
            if (activeSteps === 0) {
              diffEl.textContent = `(0 steps | 0.00%)`;
              diffEl.className = 'mt-rec-diff';
            } else {
              diffEl.textContent = `(-${activeSteps} steps | ${diffPct.toFixed(2)}%)`;
              diffEl.className = 'mt-rec-diff minus';
            }
          }

          const offsetValEl = card.querySelector('.mt-offset-val');
          if (offsetValEl) {
            if (activeSteps === 0) {
              offsetValEl.textContent = `0 steps (0.00%)`;
            } else {
              offsetValEl.textContent = `-${activeSteps} steps (${diffPct.toFixed(2)}%)`;
            }
          }
          const slider = card.querySelector('.mt-offset-range');
          if (slider) {
            const max = t.maxSteps || 500;
            slider.value = (max + 1) - activeSteps;
          }
        }
      },

          return;
        }

        const usd = t.usdAmount;
        if (!usd || usd < 1) {

          return;
        }

        const limitPrice = t.suggestedPrice;
        const productId = `${coin}-USD`;
        const cryptoSize = (usd / limitPrice).toFixed(6);

        // Always Limit buy order below the bid
        const orderType = 'limit';

        const modalMsg = `Buy <strong>${cryptoSize} ${coin}</strong> at <strong>$${limitPrice.toLocaleString()}</strong> (Limit Buy)?<br>Size: $${usd.toFixed(2)}`;

        // Show confirmation modal
        const ok = await confirmTrade(modalMsg);
        if (ok) {
          try {
            const res = await fetch('/create-buy-order', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ productId, quoteSize: usd, limitPrice: String(limitPrice), orderType })

            const data = await res.json();

            if (data.success && data.order?.success !== false) {
              const orderText = `Buy Order Placed: ${cryptoSize} ${coin} @ $${limitPrice}`;

              const newOrderId = data.order_id;

              }
              loadBalance();
              setTimeout(() => { loadOrders().then(updateMonitor); }, 1000);
            } else {

              toast(errorMsg, 'error');
            }

            toast(`Error placing order: ${err.message}`, 'error');

    function fmtVolShort(v) {
      if (v >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
      if (v >= 1e6) return '$' + (v / 1e6).toFixed(2) + 'M';

    const tvCoinData = {};

    function calcRSI(closes, period = 14) {
      if (closes.length < period + 1) return null;
      const changes = closes.slice(1).map((c, i) => c - closes[i]);
      let avgGain = 0, avgLoss = 0;
      for (let i = 0; i < period; i++) {
        if (changes[i] > 0) avgGain += changes[i]; else avgLoss += Math.abs(changes[i]);
      }
      avgGain /= period; avgLoss /= period;
      for (let i = period; i < changes.length; i++) {
        avgGain = (avgGain * (period - 1) + Math.max(0, changes[i])) / period;
        avgLoss = (avgLoss * (period - 1) + Math.max(0, -changes[i])) / period;
      }
      if (avgLoss === 0) return 100;
      return 100 - 100 / (1 + avgGain / avgLoss);
    }

    function calcEMA(closes, period) {
      if (closes.length < period) return null;
      const k = 2 / (period + 1);
      let ema = closes.slice(0, period).reduce((a, b) => a + b) / period;
      for (let i = period; i < closes.length; i++) ema = closes[i] * k + ema * (1 - k);
      return ema;
    }

    function calcCoinScoreMobile(coin) {
      const d = tvCoinData[coin];
      if (!d) return null;
      let score = 5;
      const lerp = (x, x0, y0, x1, y1) => y0 + (y1 - y0) * Math.max(0, Math.min(1, (x - x0) / (x1 - x0)));
      const rising = d.pct1h != null && (d.pct1h > 0 || d.recovering);
      // Импульс 1h, нормированный на волатильность монеты
      if (d.pct1h != null) {
        const vol = Math.max(d.avgRange || 0.5, 0.15);
        score += Math.max(-2.2, Math.min(2.2, d.pct1h / vol * 1.1));
        // Вертикальная свеча = поздний вход в памп
        if (d.pct1h > 3) score -= lerp(d.pct1h, 3, 0, 10, 2);
      }
      // Качество разворота
      if (d.recovering) {
        score += 0.8;
        if (d.fallingHours >= 4) score += 0.4;
        if (d.totalFallPct != null && d.totalFallPct < -3) score += 0.4;
        if (d.totalFallPct != null && d.totalFallPct < -6) score += 0.4;
      }
      // RSI(14) плавно
      if (d.rsi != null) {
        if (d.rsi < 50)      score += lerp(d.rsi, 25, 2, 50, 0);
        else if (d.rsi > 60) score -= lerp(d.rsi, 60, 0, 80, 2);
      }
      // RSI × тренд синергия
      if (d.rsi != null && d.pct1h != null) {
        if (d.rsi < 45 && rising)      score += 1;
        if (d.rsi > 65 && d.pct1h < 0) score -= 1;
      }
      // Объём с направлением
      if (d.volRatio != null) {
        if (d.volRatio > 1.3)      score += Math.min(1, (d.volRatio - 1.3) / 1.2) * (rising ? 1 : -1);
        else if (d.volRatio < 0.5) score -= 0.3;
      }
      // EMA20 позиция + направление
      if (d.priceVsEma != null) {
        if      (d.priceVsEma > 0 && d.emaRising)  score += 1;
        else if (d.priceVsEma > 0 && !d.emaRising) score += 0.2;
        else if (d.priceVsEma < 0 && d.emaRising)  score += 0.5;
        else if (d.priceVsEma < 0 && !d.emaRising) score -= 1;
      }
      // Крест EMA9/EMA20
      if (d.emaCross != null) score += d.emaCross > 0 ? 0.5 : -0.5;
      // Контекст 24h: дип = потенциал, перегрев = до -3.5, экстрим-памп ещё -1
      if (d.pct24h != null) {
        if (d.pct24h < -2)     score += lerp(-d.pct24h, 2, 0.2, 8, 0.7);
        else if (d.pct24h > 5) score -= lerp(d.pct24h, 5, 0.5, 30, 3.5);
        if (d.pct24h > 60)     score -= 1;
      }
      // Позиция в 24h диапазоне
      if (d.rangePos != null) {
        if (d.rangePos < 0.25)     score += rising ? 1 : 0.3;
        else if (d.rangePos > 0.9) score += (d.volRatio > 2 && rising) ? 0.5 : -0.5;
      }
      // Стабильность роста
      if (d.greenCount6 != null) {
        if (d.greenCount6 >= 4 && rising)       score += 0.5;
        else if (d.greenCount6 <= 1 && !rising) score -= 0.5;
      }
      // Волатильность
      if (d.avgRange != null) {
        if      (d.avgRange < 0.25) score -= 0.5;
        else if (d.avgRange > 1)    score += 0.3;
      }
      // Higher lows
      if (d.hlStreak >= 3) score += 0.5;
      // Ликвидность: тонкий стакан = проскальзывание
      const totalDepth = (d.bidDepth || 0) + (d.askDepth || 0);
      if (totalDepth > 0) {
        if (totalDepth < 30000)       score -= 1.5;
        else if (totalDepth < 100000) score -= 0.5;
      }
      // Перевес бидов
      if (d.bidDepth > 0 && d.askDepth > 0) {
        const ratio = d.bidDepth / d.askDepth;
        if      (ratio > 2)    score += 1;
        else if (ratio > 1.5)  score += 0.5;
        else if (ratio < 0.5)  score -= 1;
        else if (ratio < 0.67) score -= 0.5;
      }
      return Math.max(0, Math.min(10, Math.round(score * 2) / 2));
    }

    function updateScoreMobile(coin) {
      const el = document.getElementById(`tvScore_${coin}`);
      if (!el) return;
      const score = calcCoinScoreMobile(coin);
      if (score === null) return;
      const [bg, glow, tc] = score >= 8
        ? ['#00e5a0','rgba(0,229,160,0.35)','#000']

        ? ['#f5c518','rgba(245,197,24,0.35)','#000']
        : score >= 4
        ? ['#f5843a','rgba(245,132,58,0.3)','#000']
        : ['#f55353','rgba(255,83,83,0.3)','#fff'];
      const scoreTxt = score % 1 ? score.toFixed(1) : score;
      el.innerHTML = `<div style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:${bg};color:${tc};font-weight:800;font-size:${score % 1 ? 10 : 12}px;box-shadow:0 0 8px ${glow};">${scoreTxt}</div>`;
      const row = document.getElementById(`tvRow_${coin}`);
      if (row) { row.style.borderLeftColor = bg; }
    }

    function renderTopVolumeMobile(coins) {
      const body = document.getElementById('tvBody');
      if (!body) return;
      if (!coins || !coins.length) { body.innerHTML = '<div style="color:var(--t2);font-size:12px;text-align:center;padding:14px;">No data</div>'; return; }
      const rows = coins.map((c, i) => {
        tvCoinData[c.coin] = { pct24h: c.pct24h, vol: c.volUsd, pct1h: null, fallingHours: 0, recovering: false, bidDepth: 0, askDepth: 0 };
        const pctCls = c.pct24h >= 0 ? 'color:var(--green)' : 'color:#f55';
        const sign = c.pct24h >= 0 ? '+' : '';
        const price = c.price < 0.001 ? c.price.toFixed(6) : c.price < 1 ? c.price.toFixed(4) : c.price < 100 ? c.price.toFixed(3) : c.price.toFixed(2);
        const cSvg = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`;
        return `<tr id="tvRow_${c.coin}" style="border-left:3px solid transparent;" onclick="selectCoin('${c.coin}')">
          <td style="color:#555;font-size:10px;padding:5px 2px;width:18px;">${i + 1}</td>
          <td style="padding:5px 3px;width:72px;vertical-align:top;">
            <div style="font-weight:700;font-size:11px;">${c.coin}</div>
            <div style="color:#555;font-size:9px;margin-bottom:4px;">$${price}</div>
            <button onclick="event.stopPropagation();toggleTVChartVolumeMobile('${c.coin}')" style="display:flex;align-items:center;justify-content:center;gap:3px;width:100%;padding:4px 0;border:1px solid rgba(76,201,240,0.4);border-radius:5px;background:rgba(76,201,240,0.09);color:var(--blue);font-size:9px;font-weight:600;cursor:pointer;">${cSvg}</button>
          </td>
          <td style="${pctCls};font-weight:600;text-align:right;font-size:11px;padding:5px 3px;width:48px;">${sign}${c.pct24h.toFixed(2)}%</td>
          <td style="text-align:right;font-size:10px;padding:5px 3px;width:48px;color:#666;">${fmtVolShort(c.volUsd)}</td>
          <td id="tvTrend_${c.coin}" style="text-align:right;font-size:10px;line-height:1.3;color:#444;padding:5px 3px;width:62px;">...</td>
          <td id="tvDepth_${c.coin}" style="text-align:right;font-size:9px;line-height:1.4;color:#555;padding:5px 3px;width:44px;">...</td>
          <td id="tvScore_${c.coin}" style="text-align:center;padding:5px 3px;color:#444;font-size:10px;width:38px;">...</td>
        </tr>`;
      }).join('');
      body.innerHTML = `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;"><table style="width:100%;border-collapse:collapse;font-size:11px;min-width:310px;"><thead><tr style="border-bottom:1px solid #222;"><th style="width:18px;color:#666;font-weight:600;font-size:9px;padding:5px 2px;text-align:left;">#</th><th style="color:#666;font-weight:600;font-size:9px;padding:5px 3px;text-align:left;width:72px;">COIN</th><th style="color:#666;font-weight:600;font-size:9px;padding:5px 3px;text-align:right;width:48px;">24H%</th><th style="color:#666;font-weight:600;font-size:9px;padding:5px 3px;text-align:right;width:48px;">VOL</th><th style="color:#666;font-weight:600;font-size:9px;padding:5px 3px;text-align:right;width:62px;">TREND</th><th style="color:#666;font-weight:600;font-size:9px;padding:5px 3px;text-align:right;width:44px;">+2/-2</th><th style="color:#666;font-weight:600;font-size:9px;padding:5px 3px;text-align:center;width:38px;">SCR</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    async function loadTrendSequentialMobile(coins) {
      const CB = 'https://api.exchange.coinbase.com';
      for (const c of coins) {
        try {
          const now = Date.now();
          const start = new Date(now - 26 * 3600 * 1000).toISOString();
          const end = new Date(now).toISOString();
          const r = await fetch(`${CB}/products/${c.coin}-USD/candles?granularity=3600&start=${start}&end=${end}`);
          const el = document.getElementById(`tvTrend_${c.coin}`);
          if (!r.ok || !el) continue;
          const candles = await r.json();
          if (!Array.isArray(candles) || candles.length < 3) { el.innerHTML = '<span style="color:#444">—</span>'; continue; }
          candles.sort((a, b) => a[0] - b[0]);
          const closes = candles.map(x => x[4]);
          const n = closes.length;
          const pct1h = closes[n-2] ? (closes[n-1] - closes[n-2]) / closes[n-2] * 100 : null;
          let fallingHours = 0;
          for (let i = n - 2; i > 0; i--) { if (closes[i] <= closes[i-1]) fallingHours++; else break; }
          const fallStart = n - 1 - fallingHours;
          const totalFallPct = fallStart >= 0 && closes[fallStart] ? (closes[n-2] - closes[fallStart]) / closes[fallStart] * 100 : 0;
          const recovering = fallingHours >= 2 && pct1h > 0.2;
          const workCloses = closes.slice(0, -1);
          const rsi = calcRSI(workCloses, 14);
          const ema20 = calcEMA(workCloses, 20);
          const ema20prev = workCloses.length > 21 ? calcEMA(workCloses.slice(0, -1), 20) : null;
          const priceVsEma = ema20 ? (workCloses[workCloses.length - 1] - ema20) / ema20 * 100 : null;
          const emaRising = ema20 && ema20prev ? ema20 > ema20prev : null;
          const volumes = candles.map(x => x[5]);
          const avgVol = volumes.slice(0, -1).reduce((a, b) => a + b, 0) / Math.max(1, volumes.length - 1);
          const volRatio = avgVol > 0 ? volumes[n - 1] / avgVol : 1;
          // Позиция в 24h диапазоне, крест EMA9/EMA20, волатильность, higher lows
          const lows = candles.map(x => x[1]), highs = candles.map(x => x[2]);
          const lo24 = Math.min(...lows.slice(-24)), hi24 = Math.max(...highs.slice(-24));
          const rangePos = hi24 > lo24 ? (closes[n-1] - lo24) / (hi24 - lo24) : null;
          const ema9 = calcEMA(workCloses, 9);
          const emaCross = ema9 != null && ema20 != null ? (ema9 > ema20 ? 1 : -1) : null;
          const rngs = candles.slice(-13, -1).map(x => x[1] > 0 ? (x[2] - x[1]) / x[1] * 100 : 0);
          const avgRange = rngs.length ? rngs.reduce((a, b) => a + b, 0) / rngs.length : null;
          let hlStreak = 0;
          for (let i = n - 2; i > 0 && lows[i] > lows[i-1]; i--) hlStreak++;
          let greenCount6 = 0;
          for (let i = Math.max(1, n - 7); i <= n - 2; i++) if (closes[i] > closes[i-1]) greenCount6++;
          if (tvCoinData[c.coin]) Object.assign(tvCoinData[c.coin], { pct1h, fallingHours, recovering, totalFallPct, rsi, priceVsEma, emaRising, volRatio, rangePos, emaCross, avgRange, hlStreak, greenCount6 });
          updateScoreMobile(c.coin);
          const rsiHint = rsi != null ? `<span style="color:${rsi < 35 ? '#00e5a0' : rsi > 65 ? '#f55' : '#555'};font-size:9px;"> ${Math.round(rsi)}</span>` : '';
          if (pct1h == null) { el.innerHTML = '<span style="color:#444">—</span>'; }
          else if (recovering) {
            const hColor = fallingHours >= 8 ? '#ff4444' : fallingHours >= 4 ? '#f55' : '#f88';
            el.innerHTML = `<span style="color:#00e5a0;font-weight:700;">↩+${pct1h.toFixed(2)}%</span><br><span style="color:${hColor};font-size:9px;">↓${fallingHours}h${rsiHint}</span>`;
          }
          else if (pct1h >= 0) { el.innerHTML = `<span style="color:var(--green);">↑+${pct1h.toFixed(2)}%</span>${rsiHint}`; }
          else { el.innerHTML = `<span style="color:#f55;">↓${pct1h.toFixed(2)}%</span>${rsiHint}`; }
        } catch { const el = document.getElementById(`tvTrend_${c.coin}`); if (el) el.innerHTML = '<span style="color:#444">—</span>'; }
      }
    }

    async function loadDepthSequentialMobile(coins) {
      const CB = 'https://api.exchange.coinbase.com';
      for (const c of coins) {
        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const r = await fetch(`${CB}/products/${c.coin}-USD/book?level=2`);
            if (!r.ok) { if (attempt === 0) continue; break; }
            const book = await r.json();
            const lo = c.price * 0.98, hi = c.price * 1.02;
            let buy = 0, sell = 0;
            for (const e of (book.bids || [])) { const p = +e[0], s = +e[1]; if (p >= lo) buy += p * s; }
            for (const e of (book.asks || [])) { const p = +e[0], s = +e[1]; if (p <= hi) sell += p * s; }
            if (tvCoinData[c.coin]) { tvCoinData[c.coin].bidDepth = buy; tvCoinData[c.coin].askDepth = sell; }
            updateScoreMobile(c.coin);
            const el = document.getElementById(`tvDepth_${c.coin}`);
            if (el && (buy || sell)) {
              const askCol = sell >= buy ? 'var(--green)' : '#f55';
              el.innerHTML = `<span style="color:${askCol}">${fmtVolShort(sell)}</span><br><span style="color:#f55">${fmtVolShort(buy)}</span>`;
            } else if (el) { el.textContent = '—'; }
            // Мёртвый стакан (< $25K в ±2%) — торговать нельзя, приглушаем строку
            const rowM = document.getElementById(`tvRow_${c.coin}`);
            if (rowM) {
              if (buy + sell < 25000) {
                rowM.style.opacity = '0.35';
                if (el) el.innerHTML += '<br><span style="color:#f55;font-size:8px;">нет ликв.</span>';
              } else {
                rowM.style.opacity = '';
              }
            }
            break;
          } catch {}
        }
      }
    }

    async function loadTopVolumeMobile(force = false) {
      try {
        const btn = document.getElementById('tvRefreshBtn');
        if (btn) { btn.disabled = true; btn.classList.add('spinning'); }
        const tvBody = document.getElementById('tvBody');
        if (force && tvBody) tvBody.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:30px;color:var(--t2);font-size:13px;"><span style="font-size:20px;display:inline-block;animation:spin 0.8s linear infinite;">⟳</span> Loading...</div>';
        const res = await fetch(BASE + '/api/top-volume' + (force ? '?force=true' : ''));
        const data = await res.json();
        if (data.success) {
          const coins = data.coins.filter(c => c.volUsd >= 5_000_000 && c.pct24h <= 100);
          renderTopVolumeMobile(coins);
          loadTrendSequentialMobile(coins);
          loadDepthSequentialMobile(coins);
        }
        tvCountdownSec = 60;
        if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
      } catch(e) { console.error('[top-volume mobile]', e); }
    }

    function startTvCountdown() {
      clearInterval(tvTimer);
      tvTimer = setInterval(() => {
        tvCountdownSec--;
        const el = document.getElementById('tvCountdown');
        if (el) el.textContent = tvCountdownSec + 's';
        if (tvCountdownSec <= 0) { tvCountdownSec = 60; loadTopVolumeMobile(); }
      }, 1000);
    }

    // Init
    loadSettings();
    MultiTracker.init();
    loadVol30dMobile();
    setInterval(loadVol30dMobile, 5 * 60 * 1000);
    refreshAll();
    connectPriceWs();
    loadTopVolumeMobile();
    startTvCountdown();

    // Hover/touch pause listeners to freeze countdowns on mobile tables interaction
    document.getElementById('tgBody')?.addEventListener('mouseenter', () => { tgPaused = true; });
    document.getElementById('tgBody')?.addEventListener('mouseleave', () => { tgPaused = false; });
    document.getElementById('trBody')?.addEventListener('mouseenter', () => { trPaused = true; });
    document.getElementById('trBody')?.addEventListener('mouseleave', () => { trPaused = false; });
    setInterval(() => { loadBalance(); syncSelectedFromServer().finally(() => loadOrders().then(updateMonitor)); }, 10000);
    setInterval(loadHoldings, 30000);
    setInterval(updateMonitor, 5000);

    // Keyboard shortcuts: standard +/- keys for MultiTracker offset steps adjustment
    document.addEventListener('keydown', (e) => {
      const isPlus = e.key === '+' || e.key === '=' || e.code === 'Equal' || e.code === 'NumpadAdd' || e.keyCode === 187 || e.keyCode === 107;
      const isMinus = e.key === '-' || e.key === '_' || e.code === 'Minus' || e.code === 'NumpadSubtract' || e.keyCode === 189 || e.keyCode === 109;
      
      if (isPlus || isMinus) {
        if (document.activeElement && (
          (document.activeElement.tagName === 'INPUT' && document.activeElement.type !== 'range') || 
          document.activeElement.tagName === 'TEXTAREA' || 
          document.activeElement.isContentEditable
        )) {
          const id = document.activeElement.id;
          if (id === 'addTrackerCoinInput' || id === 'coinInput' || id === 'buyCoin') {
            document.activeElement.blur();
          } else {
            return;
          }
        }

        let targetCoin = null;
        if (typeof MultiTracker !== 'undefined' && MultiTracker.trackers) {
          // 1. Explicitly selected card
          if (MultiTracker.selectedCoin && MultiTracker.trackers[MultiTracker.selectedCoin]) {
            targetCoin = MultiTracker.selectedCoin;
          }
          // 2. Or if exactly one tracker is active
          if (!targetCoin) {
            const coins = Object.keys(MultiTracker.trackers);
            if (coins.length === 1) {
              targetCoin = coins[0];
            }
          }
          // 3. Or if selected coin in mobile trade panel is tracked
          const mobileTradeCoin = localStorage.getItem('mobileTradeCoin');
          if (!targetCoin && mobileTradeCoin && MultiTracker.trackers[mobileTradeCoin]) {
            targetCoin = mobileTradeCoin;
          }
          // 4. Fallback to the first active tracker if any exist
          if (!targetCoin) {
            const coins = Object.keys(MultiTracker.trackers);
            if (coins.length > 0) {
              targetCoin = coins[0];
              MultiTracker.selectCard(targetCoin);
            }
          }
          
          if (targetCoin) {
            e.preventDefault();
            if (isPlus) {
              // Raise target price -> decrease offsetSteps
              MultiTracker.adjustSteps(targetCoin, -1);
            } else {
              // Lower target price -> increase offsetSteps
              MultiTracker.adjustSteps(targetCoin, 1);
            }
          }
        }
      }
    });
  </script>
